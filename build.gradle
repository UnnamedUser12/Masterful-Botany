plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = "${mcversion}-${mod_version}-${tag_lanzador}"
group = "${mod_group}"
base {
    archivesName = "${mod_named}"
}

java.toolchain {
    languageVersion = JavaLanguageVersion.of(java_version.toInteger())
}

java {
    withSourcesJar()
}

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

neoForge {
    version = "${neoversion}"

    addModdingDependenciesTo(sourceSets.gametest)

    accessTransformers {
        file('src/main/resources/META-INF/accesstransformer.cfg')
    }

    runs {
        configureEach {
            systemProperty 'fml.earlyprogresswindow', 'false'
        }

        client {
            client()
            gameDirectory = file('run')
            def world = findProperty('vm_world') ?: 'masterful_test'
            if (file("run/saves/${world}").isDirectory()) {
                programArguments.addAll '--quickPlaySingleplayer', world.toString()
            }
        }

        server {
            server()
            gameDirectory = file('run')
            programArgument '--nogui'
        }

        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', "${modid}"
        }

        serverData {
            serverData()
            gameDirectory = file('run')
            programArguments.addAll '--mod', "${modid}", '--all',
                    '--output', file('src/generated/resources').getAbsolutePath(),
                    '--existing', file('src/main/resources').getAbsolutePath()
        }

        clientData {
            clientData()
            gameDirectory = file('run')
            programArguments.addAll '--mod', "${modid}", '--all',
                    '--output', file('src/generated/resources').getAbsolutePath(),
                    '--existing', file('src/main/resources').getAbsolutePath()
        }
    }

    mods {
        "${modid}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gametest)
        }
    }
}


sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache'
}

tasks.named('processResources') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

repositories {
    mavenCentral()
    maven {
        name = 'ModdingX Maven'
        url = 'https://maven.moddingx.org/release'
        content {
            includeGroup 'org.moddingx'
        }
    }
    maven {
        name = 'Jared'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'vazkii.patchouli'
            includeGroup 'mezz.jei'
            includeGroup 'net.mezzdev.config'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Curse Maven'
                url = 'https://cursemaven.com'
            }
        }
        filter {
            includeGroup 'curse.maven'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    implementation "curse.maven:botania-revived-1725641:${botania_curse_file_id}"

    implementation "vazkii.patchouli:patchouli-neoforge:${patchouli_version}"

    implementation "org.moddingx:LibX:${mcversion}-${libx_version}"
    annotationProcessor "org.moddingx:LibX:${mcversion}-${libx_version}"

    compileOnly "maven.modrinth:curios:${curios_version}"
    runtimeOnly "maven.modrinth:curios:${curios_version}"

    compileOnly "mezz.jei:jei-${mcversion}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${mcversion}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${mcversion}-neoforge:${jei_version}"
}

test {
    enabled = false
}

jar {
    manifest {
        attributes([
                "Specification-Title": mod_named,
                "Specification-Vendor": "${author}",
                "Specification-Version": "1",
                "Implementation-Title": mod_named,
                "Implementation-Version": "${version}",
                "Implementation-Vendor" :"${author}",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) { rename { "${it}-${modid}" } }
    from(rootProject.file('NOTICE')) { rename { "${it}-${modid}" } }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            mod_id                        : modid,
            mod_name                      : mod_name,
            mod_author                    : author,
            version                       : mod_version,
            license                       : license,
            description                   : project.description,
            minecraft_version_range       : minecraft_version_range,
            neoforge_version              : neoversion,
            neoforge_loader_version_range : loader_version,
            libx_version                  : "${mcversion}-${libx_version}".toString(),
            patchouli_version             : patchouli_version,
            curios_version                : curios_version.tokenize('+')[0],
            jei_version                   : jei_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs << '-Xmaxerrs' << '100000'
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        delete file('run/gametest/world')
    }
}

tasks.register('printCompileClasspath') {
    def cp = sourceSets.main.compileClasspath
    doLast {
        file('build/cp.txt').text = cp.files.join(File.pathSeparator)
    }
}
