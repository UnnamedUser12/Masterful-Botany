plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = "${mcversion}-${mod_version}-${tag_lanzador}"
group = "${mod_group}"
base {
    archivesName = "${mod_named}"
}

// Minecraft 1.21.1 needs Java 21
java.toolchain {
    vendor = JvmVendorSpec.ADOPTIUM
    languageVersion = JavaLanguageVersion.of(java_version.toInteger())
}

java {
    withSourcesJar()
}

// GameTests: separate source set, not part of the release jar. Run with ./gradlew runGameTestServer
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

neoForge {
    version = "${neoversion}"

    addModdingDependenciesTo(sourceSets.gametest)

    accessTransformers {
        file('src/main/resources/META-INF/accesstransformer.cfg')
    }

    runs {
        client {
            client()
            gameDirectory = file('run')
            // Abre directo el mundo de pruebas: ./gradlew runClient -Pvm_world=<carpeta en run/saves>
            def world = findProperty('vm_world') ?: 'masterful_test'
            if (file("run/saves/${world}").isDirectory()) {
                programArguments.addAll '--quickPlaySingleplayer', world.toString()
            }
        }

        server {
            server()
            gameDirectory = file('run')
            programArgument '--nogui'
        }

        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', "${modid}"
        }

        data {
            data()
            gameDirectory = file('run')
            programArguments.addAll '--mod', "${modid}", '--all',
                    '--output', file('src/generated/resources').getAbsolutePath(),
                    '--existing', file('src/main/resources').getAbsolutePath()
        }
    }

    mods {
        "${modid}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gametest)
        }
    }
}


sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache'
}

tasks.named('processResources') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

repositories {
    mavenCentral()
    maven {
        name = 'Curse Maven'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        name = 'ModdingX'
        url = 'https://maven.moddingx.org/'
        content {
            includeGroup 'org.moddingx'
        }
    }
    maven {
        name = 'Jared'
        url = 'https://maven.blamejared.com/'
    }
    maven {
        name = 'C4'
        url = 'https://maven.theillusivec4.top/'
    }
}

dependencies {
    // Botania Revived (package velrondevs.botania, modid botania)
    implementation "curse.maven:botania-revived-1725641:${botania_curse_file_id}"

    // Patchouli (required by Botania, used for the custom book pages)
    implementation "vazkii.patchouli:Patchouli:${patchouli_version}"

    // LibX (library by the original author, ModdingX)
    implementation "org.moddingx:LibX:${libx_version}"
    annotationProcessor "org.moddingx:LibX:${libx_version}"

    // Curios
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    runtimeOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"

    // JEI
    compileOnly "mezz.jei:jei-${mcversion}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${mcversion}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${mcversion}-neoforge:${jei_version}"
}

test {
    enabled = false
}

jar {
    manifest {
        attributes([
                "Specification-Title": mod_named,
                "Specification-Vendor": "${author}",
                "Specification-Version": "1",
                "Implementation-Title": mod_named,
                "Implementation-Version": "${version}",
                "Implementation-Vendor" :"${author}",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// Includes the license file in the built mod
tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) { rename { "${it}-${modid}" } }
    from(rootProject.file('NOTICE')) { rename { "${it}-${modid}" } }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            mod_id                        : modid,
            mod_name                      : mod_name,
            mod_author                    : author,
            version                       : mod_version,
            license                       : license,
            description                   : project.description,
            minecraft_version_range       : minecraft_version_range,
            neoforge_version              : neoversion,
            neoforge_loader_version_range : loader_version,
            libx_version                  : libx_version,
            patchouli_version             : patchouli_version,
            curios_version                : curios_version,
            jei_version                   : jei_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
    filesMatching(['pack.mcmeta']) {
        expand pack_format: pack_format
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs << '-Xmaxerrs' << '100000'
}

// The game tests always start from a fresh world. Chunks saved by a previous run would keep the old (possibly
// structure-less) generation results.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        delete file('run/gametest/world')
    }
}
